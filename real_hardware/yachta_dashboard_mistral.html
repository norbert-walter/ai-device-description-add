<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yachta Windsensor Dashboard</title>
  <style>
    :root {
      --sans: 'Ubuntu', sans-serif;
      --mono: 'Ubuntu Mono', monospace;
    }

    @import url('https://fonts.bunny.net/css2?family=ubuntu:wght@400;500;700&family=ubuntu-mono:wght@400;700&display=swap');

    body.theme-dark {
      --bg-color: rgb(32,32,32);
      --bg-image: linear-gradient(45deg,black 25%,transparent 25%,transparent 75%,black 75%,black),
                  linear-gradient(45deg,black 25%,transparent 25%,transparent 75%,black 75%,black),
                  linear-gradient(to bottom,rgb(8,8,8),rgb(32,32,32));
      --bg-size: 10px 10px,10px 10px,10px 5px;
      --bg-pos: 0px 0px,5px 5px,0px 0px;
      --panel: #1e1e1e;
      --border: #2e2e2e;
      --text: #c8c8c8;
      --text-strong: #ffffff;
      --muted: #5a7060;
      --label: #8ab2d0;
      --accent: #00c8a0;
      --accent2: #0084ff;
      --danger: #e84040;
      --warn: #f5a623;
      --ok: #00c8a0;
      --instr-bg: #202020;
      --instr-brd: #333333;
      --v-big-color: #ffffff;
      --v-med-color: #ffffff;
      --pulse-anim: pulse 2s infinite;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: var(--sans);
      background: var(--bg-color);
      background-image: var(--bg-image);
      background-size: var(--bg-size);
      background-position: var(--bg-pos);
      color: var(--text);
      font-size: 14px;
      line-height: 1.4;
    }

    .dashboard {
      max-width: 1000px;
      margin: 0 auto;
    }

    .grid {
      display: grid;
      grid-template-columns: 340px 160px;
      gap: 10px;
      margin-bottom: 10px;
    }

    .instr-panel {
      background: var(--instr-bg);
      border: 1px solid var(--instr-brd);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px 8px;
      gap: 6px;
      width: 340px;
      height: 340px;
    }

    .instr-panel canvas {
      display: block;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      width: 160px;
      height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .lbl {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    .v-big {
      font-family: var(--mono);
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--v-big-color);
    }

    .v-med {
      font-family: var(--mono);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--v-med-color);
    }

    .u {
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 400;
      color: var(--label);
    }

    .sub {
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 5px;
    }

    .val-strip {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      margin-top: 10px;
    }

    .badge {
      padding: 3px 9px;
      border-radius: 4px;
      font-size: 0.62rem;
      font-family: var(--mono);
      font-weight: 600;
      background: rgba(0,200,160,0.1);
      border: 1px solid rgba(0,200,160,0.25);
      color: var(--accent);
    }

    .badge.info {
      background: rgba(0,132,255,0.1);
      border-color: rgba(0,132,255,0.25);
      color: var(--accent2);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body class="theme-dark">
  <div class="dashboard">
    <div class="grid">
      <div class="instr-panel">
        <canvas id="windGauge" width="340" height="340"></canvas>
        <div class="sub" id="gaugeMeta">Windrichtung & Geschwindigkeit</div>
      </div>
      <div class="panel">
        <div class="lbl">Gerätetemperatur</div>
        <div class="v-med" id="deviceTemp">--.<span class="u">°C</span></div>
        <div class="sub">DS18B20</div>
      </div>
    </div>
    <div class="val-strip">
      <span class="badge">✓ structure</span>
      <span class="badge">✓ comprehensibility</span>
      <span class="badge">✓ functional</span>
      <span class="badge">✓ rules_compliance</span>
      <span class="badge">✓ security</span>
      <span class="badge">✓ discovery</span>
      <span class="badge">✓ timing_compliance</span>
      <span class="badge info">PASSED · Claude · 2026-07-04</span>
    </div>
  </div>

  <!-- SteelSeries Library (CDN fallback) -->
  <script src="https://cdn.jsdelivr.net/gh/norbert-walter/steelseries@master/dist/steelseries_micro.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/norbert-walter/steelseries@master/dist/tween-min.js"></script>

  <script>
    // Global gauge reference
    var windGauge;

    // Initialize gauge
    function initGauge() {
      windGauge = new steelseries.WindDirection2('windGauge', {
        size: 340,
        section: null,
        pointSymbolsVisible: true,
        frameDesign: steelseries.FrameDesign.BLACK_METAL,
        backgroundColor: steelseries.BackgroundColor.ANTHRACITE,
        lcdVisible: true,
        lcdColor: steelseries.LcdColor.STANDARD,
        lcdTitleStrings: ['Windrichtung [°]', 'Windgeschwindigkeit [kn]'],
        pointerColor: steelseries.ColorDef.RED,
        pointerTypeLatest: steelseries.PointerType.TYPE6,
        pointerTypeAverage: steelseries.PointerType.TYPE6,
        degreeScaleHalf: false
      });
    }

    // Fetch sensor data
    function fetchData() {
      const timestamp = Math.floor(Date.now() / 1000);
      const url = `https://yachta.norbert-walter.dnshome.de/json?t=${timestamp}`;

      fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.Device && data.Device.MeasuringValues) {
            const values = data.Device.MeasuringValues;
            const windDir = values.WindDirection.Value;
            const windSpeed = values.WindSpeed.Value;
            const deviceTemp = values.DeviceTemperature.Value;

            // Update gauge
            if (windGauge) {
              windGauge.setValueAnimatedLatest(windDir);
              windGauge.setValueAverage(windSpeed);
            }

            // Update temperature panel
            document.getElementById('deviceTemp').innerHTML =
              deviceTemp.toFixed(1) + '<span class="u">°C</span>';
          }
        })
        .catch(error => {
          console.error('Error fetching data:', error);
        });
    }

    // Initialize and start refresh
    window.onload = function() {
      initGauge();
      fetchData();
      setInterval(fetchData, 5000);
    };
  </script>
</body>
</html>
